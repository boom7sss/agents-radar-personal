name: Daily Agents Radar

on:
  schedule:
    # GitHub 会严重延迟、甚至丢弃高频 schedule。改用分散在非整点的多次正式尝试：
    # 17:17、19:29、21:41、23:53 CST；次日 09:13 再兜底检查前一天。
    # 已有日报时会在安装依赖和调用 DeepSeek 前退出，不会重复花费 token。
    - cron: "17 9 * * *"
    - cron: "29 11 * * *"
    - cron: "41 13 * * *"
    - cron: "53 15 * * *"
    - cron: "13 1 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional digest date for a manual backfill (YYYY-MM-DD)"
        required: false
        type: string

concurrency:
  group: daily-agents-radar
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    # Web content fetching adds ~60-120 s of HTTP requests on incremental runs;
    # the first-ever run (fetching 50 articles) may need up to 20 min.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check scheduled delivery window
        id: schedule_window
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          TODAY_CST=$(TZ=Asia/Shanghai date +%F)
          HOUR_CST=$(TZ=Asia/Shanghai date +%H)

          if [ "$EVENT_NAME" != "schedule" ]; then
            DATE_CST=${TARGET_DATE:-$TODAY_CST}
            if ! [[ "$DATE_CST" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid target_date '${DATE_CST}'; expected YYYY-MM-DD." >&2
              exit 1
            fi
            echo "date=${DATE_CST}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 傍晚运行生成当天日报；凌晨和白天到达的延迟任务补前一天。
          # 这样即使 GitHub 把 23:53 的任务拖到次日，也不会把整天日报丢掉。
          if [ "$HOUR_CST" -ge 17 ]; then
            DATE_CST=$TODAY_CST
          else
            DATE_CST=$(TZ=Asia/Shanghai date -d "yesterday" +%F)
          fi
          echo "date=${DATE_CST}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check for existing scheduled digest
        if: steps.schedule_window.outputs.skip != 'true'
        id: existing_digest
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATE_CST: ${{ steps.schedule_window.outputs.date }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ -f "digests/${DATE_CST}/ai-picks.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Daily digest for ${DATE_CST} already exists; skipping duplicate scheduled run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run daily digest
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          DEEPSEEK_THINKING: disabled
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
          DIGEST_DATE: ${{ steps.schedule_window.outputs.date }}
        run: pnpm start

      - name: Commit digest files
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        env:
          DATE_CST: ${{ steps.schedule_window.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            git commit -m "digest: ${DATE_CST} daily digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        run: pnpm manifest

      - name: Commit manifest and feed
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
            git pull --rebase
            git push
          fi

      - name: Send Telegram notification
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@agents_radar' }}
          PAGES_URL: https://boom7sss.github.io/agents-radar-personal
        run: pnpm notify

      - name: Send Feishu notification
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        env:
          FEISHU_WEBHOOK_URLS: ${{ secrets.FEISHU_WEBHOOK_URLS }}
          PAGES_URL: https://boom7sss.github.io/agents-radar-personal
        run: pnpm notify:feishu

      - name: Close stale issues
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm close-stale
