name: Monthly Agents Radar

on:
  schedule:
    # 每月1日 02:00 UTC = 10:00 CST，日报运行后2小时
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.holiday.outputs.should_run }}
    steps:
      - name: Check National Day holiday pause
        id: holiday
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          TODAY_CST=$(TZ=Asia/Shanghai date +%F)
          if [ "$EVENT_NAME" = "schedule" ] && [[ "$TODAY_CST" > "2026-09-30" && "$TODAY_CST" < "2026-10-08" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "National Day holiday pause (2026-10-01 through 2026-10-07 CST); skipping."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  monthly:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run monthly rollup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          DEEPSEEK_THINKING: disabled
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm monthly

      - name: Commit monthly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No monthly report to commit"
          else
            MONTH=$(date -u +%Y-%m)
            git commit -m "digest: ${MONTH} monthly digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        run: pnpm manifest

      - name: Commit manifest and feed
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
            git pull --rebase
            git push
          fi

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@agents_radar' }}
          PAGES_URL: https://boom7sss.github.io/agents-radar-personal
        run: pnpm notify
